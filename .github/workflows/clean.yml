name: Proxy Cleaner

on:
  workflow_dispatch:

jobs:

  clean:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v5


    - name: Download subscription

      run: |
        wget "${{ secrets.GIST_URL }}" -O source.yaml
        ls -lh source.yaml


    - name: Show proxy count

      run: |
        python3 - <<EOF
        import yaml

        with open("source.yaml","r",encoding="utf-8") as f:
            data=yaml.safe_load(f)

        print("节点数量:")
        print(len(data.get("proxies",[])))
        EOF
