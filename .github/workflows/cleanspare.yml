name: CleanSpare

on:
  workflow_dispatch:

  schedule:
    # 每 6 小时运行一次
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  cleanspare:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Download Mihomo
        shell: bash
        run: |

          set -e

          echo "获取最新 Mihomo..."

          API="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"

          URL=$(curl -fsSL "$API" \
            | jq -r '
                .assets[]
                | select(
                    .name
                    | test("mihomo-linux-amd64.*\\.gz$")
                  )
                | .browser_download_url
              ' \
            | head -n 1)

          if [ -z "$URL" ]; then
            echo "无法找到 Mihomo Linux AMD64"
            exit 1
          fi

          echo "下载：$URL"

          curl -L \
            --fail \
            --retry 3 \
            "$URL" \
            -o mihomo.gz

          gzip -d mihomo.gz

          chmod +x mihomo

          ./mihomo -v

      - name: Run cleanspare.py
        run: |
          python cleanspare.py

      - name: Check spare.yaml
        run: |

          if [ ! -f spare.yaml ]; then
            echo "spare.yaml 不存在"
            exit 1
          fi

          echo "生成的 spare.yaml："
          cat spare.yaml

      - name: Commit spare.yaml
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add spare.yaml

          if git diff --cached --quiet; then
            echo "spare.yaml 没有变化"
            exit 0
          fi

          git commit -m "Auto update spare.yaml"

          git push
