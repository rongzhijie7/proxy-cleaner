name: Clean VIP Nodes

on:
  schedule:
    - cron: "0 */4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. 拉取仓库
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # 2. 安装 Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # 3. 安装依赖
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml


      # ======================================================
      # 4. 下载 Mihomo v1.19.31
      # ======================================================

      - name: Download Mihomo
        run: |
          wget -q \
            "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-linux-amd64-v3-v1.19.31.gz" \
            -O mihomo.gz

          gunzip mihomo.gz

          chmod +x mihomo

          ./mihomo -v


      # ======================================================
      # 5. 运行清洗程序
      # ======================================================

      - name: Run clean.py
        run: |
          python clean.py


      # ======================================================
      # 6. 显示最终 cleanvip.yaml
      # ======================================================

      - name: Show cleanvip.yaml
        run: |
          echo "======================================"
          echo "最终 cleanvip.yaml"
          echo "======================================"

          if [ -f cleanvip.yaml ]; then
            cat cleanvip.yaml
          else
            echo "本轮没有生成新的 cleanvip.yaml"
            echo "可能是全部节点测试失败"
            echo "保留仓库原有版本"
          fi


      # ======================================================
      # 7. 提交更新
      # ======================================================

      - name: Commit cleanvip.yaml
        run: |

          if [ ! -f cleanvip.yaml ]; then

            echo "======================================"
            echo "没有生成 cleanvip.yaml"
            echo "本轮不提交任何文件"
            echo "======================================"

            exit 0

          fi

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add cleanvip.yaml

          if git diff --cached --quiet; then

            echo "cleanvip.yaml 没有变化"

          else

            git commit \
              -m "Auto update cleanvip.yaml"

            git push

          fi
