name: CleanVIP

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  cleanvip:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 拉取仓库
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v5

      # =====================================================
      # 安装 Python
      # =====================================================

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests pyyaml

      # =====================================================
      # 下载 Mihomo
      # =====================================================

      - name: Install Mihomo
        run: |
          MIHOMO_VERSION="v1.19.31"

          wget -q \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-v3-${MIHOMO_VERSION}.gz" \
            -O mihomo.gz

          gzip -d mihomo.gz

          chmod +x mihomo

          ./mihomo -v

      # =====================================================
      # 执行 CleanVIP
      # =====================================================

      - name: Run CleanVIP
        run: |
          python3 cleanvip.py

      # =====================================================
      # 检查输出
      # =====================================================

      - name: Check cleanvip.yaml
        run: |
          echo "=========================================="
          echo "cleanvip.yaml"
          echo "=========================================="

          cat cleanvip.yaml

          echo ""
          echo "=========================================="

      # =====================================================
      # 提交结果
      # =====================================================

      - name: Commit cleanvip.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cleanvip.yaml

          if git diff --cached --quiet; then
            echo "cleanvip.yaml 没有变化"
          else
            git commit -m "Update cleanvip nodes"
            git push
          fi
