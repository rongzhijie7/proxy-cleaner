name: CleanVIP

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  cleanvip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run CleanVIP
        run: |
          python3 cleanvip.py

      - name: Commit cleanvip.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cleanvip.yaml

          if git diff --cached --quiet; then
            echo "cleanvip.yaml 没有变化"
            exit 0
          fi

          git commit -m "Update cleanvip nodes"
          git push
