name: Clean VIP Nodes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # 1. 获取仓库
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v5


      # ==========================================
      # 2. 安装 Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ==========================================
      # 3. 安装 Python 依赖
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml


      # ==========================================
      # 4. 下载 Mihomo
      # ==========================================

      - name: Download Mihomo
        run: |

          wget -O mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/latest/download/mihomo-linux-amd64-v3-alpha.gz

          gunzip mihomo.gz

          chmod +x mihomo

          ./mihomo -v


      # ==========================================
      # 5. 运行清洗程序
      # ==========================================

      - name: Clean VIP
        run: |
          python clean.py


      # ==========================================
      # 6. 查看输出
      # ==========================================

      - name: Show clean.yaml
        run: |
          echo "======================================"
          echo "clean.yaml"
          echo "======================================"

          cat clean.yaml


      # ==========================================
      # 7. 提交 clean.yaml
      # ==========================================

      - name: Commit clean.yaml
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add clean.yaml

          if git diff --cached --quiet; then

            echo "clean.yaml 没有变化"

          else

            git commit \
              -m "Auto update clean.yaml"

            git push

          fi
