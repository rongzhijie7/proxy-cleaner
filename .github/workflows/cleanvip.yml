name: Clean VIP

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Download VIP
        run: |
          wget "${{ secrets.GIST_URL }}" -O source.yaml
          ls -lh source.yaml

      - name: Install Python
        run: |
          pip install pyyaml

      - name: Clean VIP
        run: |
          python clean.py

      - name: Save cleanvip.yaml
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cleanvip.yaml

          git commit -m "update cleanvip subscription" || echo "no changes"

          git push
